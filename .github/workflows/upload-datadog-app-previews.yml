name: Upload Datadog App Previews

on:
  workflow_run:
    workflows: ['Deploy Datadog Apps']
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: datadog-app-preview-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  upload-preview:
    name: Upload completed PR previews
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check Datadog preview secrets
        id: auth
        env:
          DD_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DD_APP_KEY: ${{ secrets.DATADOG_APP_KEY }}
        run: |
          if [ -n "$DD_API_KEY" ] && [ -n "$DD_APP_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping previews because DATADOG_API_KEY / DATADOG_APP_KEY are not configured."
          fi
      - name: Check for preview archives
        id: artifacts
        if: steps.auth.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          count=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name | startswith("datadog-app-preview-"))] | length')
          if [ "$count" -gt 0 ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "No preview archives were produced by this pull request."
          fi
      - name: Download preview archives
        if: steps.auth.outputs.configured == 'true' && steps.artifacts.outputs.any == 'true'
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: datadog-app-preview-*
          path: ${{ runner.temp }}/datadog-previews
      - name: Upload or report preview results
        if: steps.auth.outputs.configured == 'true' && steps.artifacts.outputs.any == 'true'
        env:
          DD_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DD_APP_KEY: ${{ secrets.DATADOG_APP_KEY }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          failed=0
          report_failure() {
            local app_path="$1"
            if ! curl --fail-with-body --show-error --silent \
              -H "DD-API-KEY: $DD_API_KEY" \
              -H "DD-APPLICATION-KEY: $DD_APP_KEY" \
              -H "test-drive-code-in-ab-preview: 1" \
              -F "preview_repository=$REPOSITORY_URL" \
              -F "preview_commit_sha=$EXPECTED_SHA" \
              -F "preview_app_path=$app_path" \
              -F "preview_status=failed" \
              "https://api.datad0g.com/api/unstable/app-builder-code/apps/upload-preview"; then
              echo "::error::Could not report the failed preview for $app_path"
            fi
          }
          while IFS= read -r -d '' metadata; do
            directory=$(dirname "$metadata")
            archive="$directory/app.zip"
            app_path=$(jq -er '.app_path' "$metadata")
            name=$(jq -er '.name' "$metadata")
            artifact_sha=$(jq -er '.commit_sha' "$metadata")
            if [ "$artifact_sha" != "$EXPECTED_SHA" ]; then
              echo "::error::Artifact commit $artifact_sha does not match workflow commit $EXPECTED_SHA"
              exit 1
            fi
            if [ ! -s "$archive" ]; then
              echo "::error::Preview build did not produce app.zip for $app_path"
              report_failure "$app_path"
              failed=1
              continue
            fi
            if ! curl --fail-with-body --show-error --silent \
              -H "DD-API-KEY: $DD_API_KEY" \
              -H "DD-APPLICATION-KEY: $DD_APP_KEY" \
              -H "test-drive-code-in-ab-preview: 1" \
              -F "bundle=@$archive;type=application/zip" \
              -F "name=$name" \
              -F "preview_repository=$REPOSITORY_URL" \
              -F "preview_commit_sha=$EXPECTED_SHA" \
              -F "preview_app_path=$app_path" \
              "https://api.datad0g.com/api/unstable/app-builder-code/apps/upload-preview"; then
              echo "::error::Preview upload failed for $app_path"
              report_failure "$app_path"
              failed=1
            fi
          done < <(find "$RUNNER_TEMP/datadog-previews" -name preview-metadata.json -print0)
          exit "$failed"
